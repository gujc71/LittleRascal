<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>몽이네 분식에 두고 간 물건 찾기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: illustrated shop scene on the left, chalkboard checklist on the right; stacks on phones. Single deliberate look. */
:root{
  --page:#DDE8DC;      /* 교실 타일 민트 */
  --board:#2F4A3C;     /* 칠판 */
  --board-2:#3A5A49;
  --chalk:#F4F1E6;
  --chalk-dim:#B9C8BC;
  --sauce:#D8432C;     /* 떡볶이 빨강 */
  --gold:#F2B43C;
  --ink:#24302A;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:960px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(36,48,42,.18);background:#2b2f33;max-width:100%}
.stage svg{display:block;width:100%;height:auto;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.stage svg.zoomed{touch-action:none}
.stage svg.panning,.stage svg.panning *{cursor:grabbing!important}
.ztip{margin:0;font-size:.8rem;color:var(--chalk-dim);line-height:1.5}
.mov{cursor:grab;transform-box:fill-box;transform-origin:center;transition:transform .7s cubic-bezier(.3,1.4,.5,1),filter .2s}
.mov:hover{filter:brightness(1.06) drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.mov.pulse{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{filter:drop-shadow(0 0 10px #FFE066) brightness(1.15)}}
.item .hit{fill:transparent;cursor:crosshair}
.item.locked,.item.locked *{pointer-events:none}
.done-card[hidden]{display:none}
.ring{fill:none;stroke:#E0362B;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.miss{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;animation:fade 0.8s ease-out forwards}
@keyframes fade{0%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.hintring{fill:rgba(255,224,102,.18);stroke:#FFE066;stroke-width:3;stroke-dasharray:8 6;animation:hint 1.2s ease-in-out 3 forwards}
@keyframes hint{0%,100%{opacity:.2}50%{opacity:1}}

.board{background:var(--board);color:var(--chalk);border-radius:14px;padding:20px 20px 18px;border:8px solid #8A6A45;box-shadow:inset 0 0 40px rgba(0,0,0,.25),0 10px 30px rgba(36,48,42,.18);display:flex;flex-direction:column;gap:14px}
.top{max-width:960px;margin:0 auto 16px;background:var(--board);color:var(--chalk);border-radius:14px;padding:12px 16px;border:6px solid #8A6A45;box-shadow:inset 0 0 40px rgba(0,0,0,.25),0 10px 30px rgba(36,48,42,.18);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.2;margin:0;text-wrap:balance}
.top h1 span{color:var(--gold)}
.top .stats{flex:0 1 auto}
.top .stat{display:flex;align-items:baseline;gap:6px;white-space:nowrap;flex-direction:row-reverse}
.top .stat b{display:inline}
.top .stats .b-hint{flex:none;white-space:nowrap}
.lead{margin:0;font-size:.92rem;line-height:1.55;color:var(--chalk-dim)}
.sec h2{font-family:var(--f-display);font-weight:400;font-size:1rem;margin:0 0 8px;letter-spacing:.04em;color:var(--gold);display:flex;justify-content:space-between}
.sec h2 small{color:var(--chalk-dim);font-family:var(--f-body);font-size:.8rem;letter-spacing:0}
.list{list-style:none;margin:0;padding:0 0 6px;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.list li{flex:none;min-width:76px;box-sizing:border-box;scroll-snap-align:start;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1.5px dashed rgba(244,241,230,.35);border-radius:10px;position:relative;font-family:var(--f-display);font-size:.95rem}
.list li svg{width:38px;height:38px}
.list li.done{border-style:solid;border-color:var(--gold);background:rgba(242,180,60,.12)}
.list li.done::after{content:"";position:absolute;inset:6px;border:3px solid #E0362B;border-radius:50%;opacity:.85}
.stats{display:flex;gap:10px;font-variant-numeric:tabular-nums}
.stat{flex:1;background:var(--board-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.stat span{font-size:.75rem;color:var(--chalk-dim)}
.msg{min-height:1.4em;margin:0;font-family:var(--f-display);font-size:1rem;color:var(--gold)}
.btns{display:flex;gap:8px}
button{font-family:var(--f-display);font-size:1rem;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;flex:1}
.b-hint{background:var(--gold);color:var(--ink)}
.b-hint:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid #FFE066;outline-offset:2px}

.start-card div{max-width:340px}
.start-card p{text-align:left;font-size:1.02rem;line-height:1.7;word-break:keep-all}
.done-card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(36,48,42,.55);padding:16px}
.done-card div{background:var(--chalk);color:var(--ink);border-radius:16px;padding:24px 22px;text-align:center;max-width:300px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.done-card h3{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:0 0 6px;color:var(--sauce)}
.done-card p{margin:0 0 16px;line-height:1.5}
.done-card button{background:var(--sauce);color:#fff;width:100%}
@media (prefers-reduced-motion:reduce){.mov{transition:none}.ring,.miss,.hintring,.mov.pulse{animation:none;stroke-dashoffset:0}}
</style>
<style>.title-back{color:inherit;text-decoration:none;margin-right:.3em}.title-back:hover{opacity:.7}.done-card .home{display:block;margin-top:10px;color:inherit;opacity:.8}</style>
</head>

<script>
const ITEMS=[
  {id:'pencil',name:'연필',kind:'open',sym:'s-pencil',cx:706,cy:566,r:30},
  {id:'star',name:'별 배지',kind:'open',sym:'s-star',cx:316,cy:235,r:22},
  {id:'key',name:'열쇠',kind:'open',sym:'s-key',cx:140,cy:542,r:26},
  {id:'test',name:'100점 시험지',kind:'hidden',sym:'s-test',cx:197,cy:628,r:38,cover:'m-bag'},
  {id:'ddakji',name:'딱지',kind:'hidden',sym:'s-ddakji',cx:477,cy:627,r:30,cover:'m-lid'},
  {id:'shoe',name:'실내화',kind:'hidden',sym:'s-shoe',cx:109,cy:699,r:40,cover:'m-chairL'},
  {id:'marble',name:'구슬',kind:'hidden',sym:'s-marble',cx:244,cy:461,r:20,cover:'m-bowls'},
  {id:'eraser',name:'지우개',kind:'hidden',sym:'s-eraser',cx:371,cy:556,r:24,cover:'m-pan'},
  {id:'letter',name:'쪽지 편지',kind:'hidden',sym:'s-letter',cx:116,cy:458,r:26,cover:'m-poster'}
];
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('scene'),fx=document.getElementById('fx');
let found=new Set(),misses=0,hints=3,start=null,timer=null,doneAt=null;

function renderLists(){
  const ul=document.getElementById('list');ul.innerHTML='';ul.scrollLeft=0;
  ITEMS.forEach(i=>{
    const li=document.createElement('li');li.id='li-'+i.id;
    li.innerHTML=`<svg viewBox="0 0 40 40"><use href="#${i.sym}" x="4" y="4" width="32" height="32"/></svg>${i.name}`;
    ul.appendChild(li);
  });
}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tick(){if(start)document.getElementById('time').textContent=fmt(Math.floor((Date.now()-start)/1000))}
function ensureTimer(){if(!start){start=Date.now();timer=setInterval(tick,500)}}
function say(t){document.getElementById('msg').textContent=t}
function pt(evt){const p=svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function updateCounts(){
  document.getElementById('c1').textContent=found.size+' / '+ITEMS.length;
}
function markFound(item){
  if(found.has(item.id))return;
  found.add(item.id);
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',item.cx);c.setAttribute('cy',item.cy);c.setAttribute('r',item.r);c.setAttribute('class','ring');
  fx.appendChild(c);
  document.getElementById('li-'+item.id).classList.add('done');
  updateCounts();
  say('찾았다! '+item.name);
  if(found.size===ITEMS.length)finish();
}
function finish(){
  clearInterval(timer);tick();markSolved();
  const secs=Math.floor((Date.now()-start)/1000);
  document.getElementById('doneText').textContent=`${fmt(secs)} 만에 아홉 개를 모두 찾았어요. 헛손질 ${misses}번, 힌트 ${3-hints}번.`;
  setTimeout(()=>{document.getElementById('doneCard').hidden=false},700);
}
svg.addEventListener('click',e=>{
  if(found.size===ITEMS.length)return;
  ensureTimer();
  const itemEl=e.target.closest('.item');
  if(itemEl&&!itemEl.classList.contains('locked')){
    const it=ITEMS.find(i=>'i-'+i.id===itemEl.id);
    if(it.cover&&document.getElementById(it.cover).dataset.moved!=='1')return;
    if(found.has(it.id)){say('이미 찾은 물건이에요.');return}
    markFound(it);return;
  }
  const mov=e.target.closest('.mov');
  if(mov){
    const moved=mov.dataset.moved==='1';
    mov.dataset.moved=moved?'0':'1';
    mov.style.transform=moved?'':mov.dataset.move;
    ITEMS.filter(i=>i.cover===mov.id).forEach(i=>{
      document.getElementById('i-'+i.id).classList.toggle('locked',moved);
    });
    say(moved?'제자리에 돌려놨어요.':'슥, 옮겼어요. 밑에 뭐가 있나 볼까요?');
    return;
  }
  misses++;document.getElementById('miss').textContent=misses;
  const p=pt(e),g=document.createElementNS(NS,'path');
  g.setAttribute('d',`M${p.x-9} ${p.y-9} L${p.x+9} ${p.y+9} M${p.x+9} ${p.y-9} L${p.x-9} ${p.y+9}`);
  g.setAttribute('class','miss');fx.appendChild(g);setTimeout(()=>g.remove(),800);
  say('거기엔 없어요.');
});
document.getElementById('hint').addEventListener('click',()=>{
  if(hints<=0)return;
  const left=ITEMS.filter(i=>!found.has(i.id));if(!left.length)return;
  ensureTimer();
  const it=left[Math.floor(Math.random()*left.length)];
  hints--;const b=document.getElementById('hint');b.textContent=`힌트 (${hints})`;b.disabled=hints===0;
  if(it.cover&&document.getElementById(it.cover).dataset.moved!=='1'){
    const m=document.getElementById(it.cover);m.classList.remove('pulse');void m.getBBox();m.classList.add('pulse');
    say(`${it.name}은(는) 반짝이는 물건 밑에 있어요.`);
  }else{
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',it.cx+(Math.random()*40-20));c.setAttribute('cy',it.cy+(Math.random()*40-20));c.setAttribute('r',70);c.setAttribute('class','hintring');
    fx.appendChild(c);setTimeout(()=>c.remove(),3700);
    say(`${it.name}은(는) 노란 동그라미 근처에 있어요.`);
  }
});
function reset(){
  found.clear();misses=0;hints=3;start=null;clearInterval(timer);
  fx.innerHTML='';document.getElementById('miss').textContent='0';document.getElementById('time').textContent='0:00';
  const b=document.getElementById('hint');b.textContent='힌트 (3)';b.disabled=false;
  document.querySelectorAll('.mov').forEach(m=>{m.dataset.moved='0';m.style.transform='';m.classList.remove('pulse')});
  ITEMS.filter(i=>i.cover).forEach(i=>document.getElementById('i-'+i.id).classList.add('locked'));
  if(typeof applyVB==='function'){vb={...BASE};applyVB()}
  document.getElementById('doneCard').hidden=true;
  document.getElementById('startCard').hidden=false;
  renderLists();updateCounts();say('');
}

/* 확대·축소·이동 */
const BASE={x:0,y:100,w:768,h:924},MAXZ=4;
let vb={...BASE};
function scale(){return BASE.w/vb.w}
function applyVB(){
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const z=scale();
  svg.classList.toggle('zoomed',z>1.001);
}
function clampVB(){
  vb.x=Math.min(Math.max(vb.x,BASE.x),BASE.x+BASE.w-vb.w);
  vb.y=Math.min(Math.max(vb.y,BASE.y),BASE.y+BASE.h-vb.h);
}
function zoomAt(f,cx,cy){
  const nz=Math.min(MAXZ,Math.max(1,scale()*f));
  const nw=BASE.w/nz,nh=BASE.h/nz;
  vb.x=cx-(cx-vb.x)*(nw/vb.w);vb.y=cy-(cy-vb.y)*(nh/vb.h);
  vb.w=nw;vb.h=nh;clampVB();applyVB();
}
function toSvg(clientX,clientY){
  const r=svg.getBoundingClientRect();
  return {x:vb.x+(clientX-r.left)*vb.w/r.width,y:vb.y+(clientY-r.top)*vb.h/r.height};
}
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const p=toSvg(e.clientX,e.clientY);
  zoomAt(Math.pow(1.0015,-e.deltaY),p.x,p.y);
},{passive:false});

let dragged=false,last=null,pinch=null;
/* 마우스: 확대 상태에서 끌면 이동 */
svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')return;
  dragged=false;last={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};
});
window.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||!last||scale()<=1.001)return;
  if(!dragged&&Math.hypot(e.clientX-last.sx,e.clientY-last.sy)<6)return;
  dragged=true;svg.classList.add('panning');panBy(e.clientX-last.x,e.clientY-last.y);
  last.x=e.clientX;last.y=e.clientY;
});
window.addEventListener('pointerup',e=>{if(e.pointerType!=='touch'){last=null;svg.classList.remove('panning')}});
function panBy(dx,dy){
  const r=svg.getBoundingClientRect();
  vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.h/r.height;clampVB();applyVB();
}
/* 터치: 두 손가락 = 확대·축소, 한 손가락 = 확대 상태에서 이동 */
function tmid(t){return {x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2}}
function tdist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
svg.addEventListener('touchstart',e=>{
  const t=e.touches;
  if(t.length===1){dragged=false;pinch=null;last={x:t[0].clientX,y:t[0].clientY,sx:t[0].clientX,sy:t[0].clientY}}
  else if(t.length>=2){e.preventDefault();dragged=true;last=null;pinch={d:tdist(t),m:tmid(t)}}
},{passive:false});
svg.addEventListener('touchmove',e=>{
  const t=e.touches;
  if(t.length>=2&&pinch){
    e.preventDefault();
    const d=tdist(t),m=tmid(t);
    panBy(m.x-pinch.m.x,m.y-pinch.m.y);
    const c=toSvg(m.x,m.y);
    if(pinch.d>0)zoomAt(d/pinch.d,c.x,c.y);
    pinch={d,m};return;
  }
  if(t.length===1&&last&&scale()>1.001){
    e.preventDefault();
    if(!dragged&&Math.hypot(t[0].clientX-last.sx,t[0].clientY-last.sy)<6)return;
    dragged=true;panBy(t[0].clientX-last.x,t[0].clientY-last.y);
    last.x=t[0].clientX;last.y=t[0].clientY;
  }
},{passive:false});
svg.addEventListener('touchend',e=>{
  const t=e.touches;
  if(t.length<2)pinch=null;
  if(t.length===1)last={x:t[0].clientX,y:t[0].clientY,sx:t[0].clientX,sy:t[0].clientY};
  if(t.length===0)last=null;
});
svg.addEventListener('touchcancel',()=>{pinch=null;last=null});
['gesturestart','gesturechange'].forEach(n=>svg.addEventListener(n,e=>e.preventDefault()));
// 끌어서 옮긴 뒤 손을 뗄 때 생기는 클릭은 게임 클릭으로 치지 않음
svg.addEventListener('click',e=>{if(dragged){e.stopImmediatePropagation();dragged=false}},true);
applyVB();
document.getElementById('again').addEventListener('click',reset);
document.getElementById('startBtn').addEventListener('click',()=>{document.getElementById('startCard').hidden=true;ensureTimer()});
reset();
</script>

</body></html>
