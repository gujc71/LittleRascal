<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>역사 십자말풀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 모눈 다이어리 같은 바탕 위 스티커 퍼즐판, 아래 말풍선 정답 카드, 탭으로 나눈 문제 목록 */
:root{
  --bg:#f6f6fb; --paper:#ffffff; --ink:#26243a; --muted:#77748f;
  --lilac:#c9c3ee; --plum:#5b4fcf; --pink:#5b4fcf; --pink-soft:#ecebfb;
  --mint:#e4e1fa; --mint-ink:#4a3fb8; --peach:#fff0b8; --line:#e3e1f0; --bad:#d4483b;
  color-scheme:light;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,6vw,2.4rem);margin:0;color:var(--plum);text-wrap:balance;position:relative;display:inline-block}
.sub{margin:0;color:var(--muted);font-size:.95rem}
.score{font-family:var(--display);font-size:1.05rem;color:var(--plum);background:var(--pink-soft);border-radius:999px;padding:3px 13px;
  font-variant-numeric:tabular-nums}
.score b{font-weight:400}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}}
.boardbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.board{display:grid;gap:3px;width:100%;max-width:520px;margin:0 auto}
.cell{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:clamp(.9rem,4.2vw,1.4rem);color:var(--ink);
  background:var(--paper);border:1.6px solid var(--lilac);border-radius:7px;cursor:pointer;
  user-select:none;-webkit-tap-highlight-color:transparent;padding:0;max-width:100%;transition:background .15s}
.cell.empty{background:transparent;border:none;cursor:default}
.cell .n{position:absolute;top:1px;left:3px;font-family:var(--body);font-size:clamp(.5rem,1.9vw,.68rem);color:var(--muted);font-weight:700;line-height:1}
.cell.solved{background:var(--mint);border-color:var(--lilac);color:var(--mint-ink)}
.cell.inword{background:var(--pink-soft);border-color:var(--plum)}
.cell.cur{background:var(--peach);border-color:var(--plum)}
.cell.reveal{color:var(--bad)}
.cell:focus-visible{outline:3px solid var(--plum);outline-offset:1px}

.ask{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.ask .tag{display:inline-block;font-family:var(--display);font-size:.95rem;color:var(--paper);background:var(--plum);border-radius:999px;padding:1px 12px;margin-right:6px}
.ask .len{color:var(--pink);font-family:var(--display);font-size:.95rem}
.ask p{margin:8px 0 12px;font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 140px;min-width:0;font:inherit;font-size:1.15rem;padding:10px 14px;border-radius:999px;
  border:2px solid var(--lilac);background:var(--bg);color:var(--ink)}
.row input::placeholder{color:var(--muted);letter-spacing:.12em}
.row input:focus{outline:none;border-color:var(--plum)}
button{font-family:var(--display);font-size:1.05rem;border-radius:999px;padding:10px 18px;cursor:pointer;
  border:none;background:var(--plum);color:var(--paper);transition:transform .1s}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.msg{min-height:1.5em;margin-top:8px;font-size:.98rem;font-family:var(--display)}
.msg.ok{color:var(--mint-ink)} .msg.no{color:var(--bad)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}

.clues{display:grid;gap:18px}
.clues h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0 0 6px;color:var(--plum)}
.clues ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.clues li{display:grid;grid-template-columns:2em minmax(0,1fr);gap:4px;padding:7px 10px;border-radius:12px;cursor:pointer;background:var(--paper);border:1.5px solid var(--line)}
.clues li .k{font-family:var(--display);color:var(--pink);font-variant-numeric:tabular-nums}
.clues li.on{background:var(--peach);border-color:#e9cf6a}
.clues li.done{background:var(--mint);border-color:var(--lilac);color:var(--muted)}
.clues li.done .k{color:var(--mint-ink)}
.clues li.done .t{text-decoration:line-through;text-decoration-color:var(--mint-ink)}
.clues li:focus-visible{outline:2px solid var(--plum)}
.win{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:16px;background:rgba(38,36,58,.45)}
.win.show{display:flex}
.wincard{width:100%;max-width:380px;padding:24px 20px 20px;border-radius:18px;background:var(--plum);color:var(--paper);text-align:center;
  box-shadow:0 12px 32px rgba(40,36,80,.3);animation:pop .4s}
.wincard p{margin:0 0 18px;font-family:var(--display);font-size:1.35rem;line-height:1.4;text-wrap:balance}
.winbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.winbtns button{background:var(--paper);color:var(--plum)}
.winbtns .ghost{background:transparent;color:var(--paper);border:1.5px solid rgba(255,255,255,.6)}
.tabs{display:none}
@media (max-width:760px){
  .wrap{padding-block:6px 12px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  header{flex-wrap:nowrap;margin-bottom:6px}
  h1{font-size:1.45rem;line-height:1.2}
  .sub{font-size:.8rem;line-height:1.3}
  .score{flex:none;font-size:.95rem;padding:2px 10px}
  .main{gap:6px}
  .boardbox{padding:5px;border-radius:14px}
  .board{gap:2px;max-width:none}
  .cell{border-width:1.3px;border-radius:5px}
  .ask{position:sticky;bottom:0;z-index:5;margin-top:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
    border-radius:14px 14px 0 0;box-shadow:0 -4px 14px rgba(40,36,80,.08)}
  .ask p{margin:2px 0 6px;font-size:.98rem;line-height:1.4}
  .row{flex-wrap:nowrap}
  .row input{flex:1 1 auto;font-size:1.1rem;padding:8px 12px}
  button{padding:8px 16px}
  .msg{min-height:1.2em;margin-top:2px;font-size:.9rem}
  .msg:empty{min-height:0;margin:0}
  .clues{gap:4px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding-block:6px}
  .tab{background:var(--paper);color:var(--plum);padding:6px;border:1.5px solid var(--lilac);box-shadow:none}
  .tab[aria-selected="true"]{background:var(--plum);color:var(--paper);border-color:var(--plum)}
  .col h2{display:none}
  .col.hide{display:none}
  .clues li{padding:6px 8px;font-size:.95rem;line-height:1.4}
}
.home{max-width:620px;margin:0 auto}
.home h1{font-size:clamp(1.8rem,7vw,2.6rem)}
.home .sub{margin-top:4px;font-size:1rem}
.eras{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.era{width:100%;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;
  background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-family:var(--body)}
.era:hover{border-color:var(--plum)}
.era .no{font-family:var(--display);font-size:1.3rem;color:var(--plum);background:var(--pink-soft);border-radius:999px;width:2.4rem;height:2.4rem;display:grid;place-items:center}
.era .nm{font-family:var(--display);font-size:1.2rem;display:block;line-height:1.3}
.era .ds{display:block;font-size:.86rem;color:var(--muted);line-height:1.35;margin-top:2px}
.era .q{font-family:var(--display);font-size:.9rem;color:var(--muted);white-space:nowrap}
.back{background:transparent;color:var(--plum);border:1px solid var(--lilac);padding:4px 12px;font-size:.92rem;margin-bottom:6px}
.game[hidden],.home[hidden]{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{flex:1 1 auto;min-width:0}
.tohub{flex:none;white-space:nowrap;font-family:var(--display);font-size:.95rem;text-decoration:none;color:var(--plum);
  background:var(--paper);border:1px solid var(--lilac);border-radius:999px;padding:6px 14px}
.tohub:hover{border-color:var(--plum)}
.tohub:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
@media (max-width:760px){
  .back{padding:3px 10px;margin-bottom:4px}
  .home{padding-top:6px}
  .home h1{font-size:1.6rem;line-height:1.2}
  .home .sub{font-size:.9rem}
  .tohub{font-size:.85rem;padding:5px 11px}
  .eras{margin-top:12px;gap:8px}
  .era{grid-template-columns:2rem minmax(0,1fr) auto;gap:10px;padding:10px 12px}
  .era .no{width:2rem;height:2rem;font-size:1.1rem}
  .era .nm{font-size:1.05rem}
  .era .ds{font-size:.8rem}
  .era .q{font-size:.8rem}
}
</style>
<div class="wrap">
  <section class="home" id="home">
    <div class="top">
      <h1><a class="title-back" href="../index.html" aria-label="게임 목록으로">←</a>역사 십자말풀이</h1>
      <a class="tohub" href="../index.html">게임 목록</a>
    </div>
    <p class="sub">풀고 싶은 시대를 고르면 바로 시작해요.</p>
    <ul class="eras" id="eras"></ul>
  </section>

  <section class="game" id="game" hidden>
    <button type="button" class="back" id="back">← 시대 고르기</button>
    <header>
      <div>
        <h1 id="eraName">조선 시대</h1>
        <p class="sub">칸이나 문제를 누르고 정답을 써 보세요.</p>
      </div>
      <div class="score" aria-live="polite">맞힌 낱말 <b id="cnt">0</b> / <span id="tot">0</span></div>
    </header>
    <div class="main">
      <section>
        <div class="boardbox"><div class="board" id="board" role="grid" aria-label="십자말풀이 판"></div></div>
        <div class="ask" id="ask">
          <div><span class="tag" id="askTag">가로 1</span><span class="len" id="askLen">3글자</span></div>
          <p id="askClue"></p>
          <form class="row" id="form" autocomplete="off">
            <input id="ans" type="text" inputmode="text" placeholder="정답을 써 보세요" aria-label="정답 입력">
            <button type="submit">확인</button>
          </form>
          <div class="msg" id="msg" aria-live="polite"></div>
        </div>
        <div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="winMsg">
          <div class="wincard">
            <p id="winMsg"></p>
            <div class="winbtns">
              <button type="button" id="winBack">시대 고르기</button>
              <button type="button" class="ghost" id="winClose">판 보기</button>
            </div>
          </div>
        </div>
      </section>
      <section class="clues">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" class="tab" id="tabA" aria-selected="true">가로 문제</button>
          <button type="button" role="tab" class="tab" id="tabD" aria-selected="false">세로 문제</button>
        </div>
        <div class="col" id="colA"><h2>가로 문제</h2><ol id="listA"></ol></div>
        <div class="col" id="colD"><h2>세로 문제</h2><ol id="listD"></ol></div>
      </section>
    </div>
  </section>
</div>

        if(next) setTimeout(()=>{ if(G===state){select(next,false);setMsg('정답이에요! 다음 문제로 넘어갈게요.','ok')} },700);
      }else{
        const box=$('ask'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
        setMsg(v.length!==cur.w.length?`${cur.w.length}글자 낱말이에요. 다시 생각해 보세요.`:'아쉬워요. 다시 생각해 보세요.','no');
      }
    }
    const state={submit}; G=state;
    select(words.slice().sort((a,b)=>a.n-b.n)[0],false);
  }
  function setMsg(t,cls){const m=$('msg');m.textContent=t;m.className='msg '+(cls||'');}
  function showTab(d){
    $('tabA').setAttribute('aria-selected',d==='A');
    $('tabD').setAttribute('aria-selected',d==='D');
    $('colA').classList.toggle('hide',d!=='A');
    $('colD').classList.toggle('hide',d!=='D');
  }
  $('form').addEventListener('submit',e=>{e.preventDefault(); if(G) G.submit();});
  $('tabA').addEventListener('click',()=>showTab('A'));
  $('tabD').addEventListener('click',()=>showTab('D'));
  route();
})();
</script>
