<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ef6221">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
.hub-back{display:block;margin-bottom:2px}
.hub-back a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:1;
  color:var(--muted);text-decoration:none;padding:6px 11px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface)}
.hub-back a:hover{color:var(--ink)}
.hub-back a:focus-visible{outline:3px solid var(--heat,var(--ink));outline-offset:2px}
</style>
<title>딱 한 시간만 했어요</title>
<meta name="description" content="게임을 딱 한 시간만 했다는 6학년 재인. 잘 시간이 되기 전에 진술의 빈틈을 찾아 진짜 게임 시간을 알아내는 설득 추리 게임.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="개구쟁이들">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="딱 한 시간만 했어요">
<meta property="og:description" content="게임을 딱 한 시간만 했다는 6학년 재인. 잘 시간이 되기 전에 진술의 빈틈을 찾아 진짜 게임 시간을 알아내는 설득 추리 게임.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a night-time living room on top (재인 on the sofa, lit by a warm floor lamp), below it the
   parent's side: 재인's statements as a speech log and an evidence folder of screens and notes.
   One hot orange accent stands for the overheated tablet. */
:root{
  color-scheme:light;
  --bg:#eff5ff; --surface:#ffffff; --paper:#fbfcff; --ink:#1c1f33; --muted:#616885;
  --line:#dde5f4; --heat:#ef6221; --heat-ink:#ffffff; --ok:#1f9d89;
  --room:#d9e8ff; --room-2:#fbf7ff; --lamp:#ffc368; --room-tag:#2f5fa8; --room-ink:#1e2545; --mom:#b4551f; --narr:#5a628a;
  --shadow:0 1px 0 rgba(28,31,51,.06),0 6px 18px rgba(28,31,51,.08);
  --f-display:"Black Han Sans","Gowun Dodum",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-talk:"Jua","Gowun Dodum",sans-serif;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--heat);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding-block:12px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:end}
.brand small{display:block;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;text-wrap:balance}
.brand h1 em{font-style:normal;color:var(--heat)}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1}
.clock small{display:block;font-size:12px;color:var(--muted)}
.clock.low b{color:var(--heat)}
.gauges{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.g label{font-weight:700}
.g .bar{height:12px;border-radius:6px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.g .bar i{display:block;height:100%;width:0;transition:width .5s cubic-bezier(.3,.8,.3,1)}
.g-conf .bar i{background:var(--ok)}
.g-upset .bar i{background:var(--heat)}
.g b{font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}
.g-upset.hot{animation:shake .4s}
.g small{grid-column:1/-1;color:var(--muted);font-size:11.5px;margin-top:-4px}

/* Living room stage */
.room{position:relative;border-radius:10px;color:var(--room-ink);min-height:clamp(270px,38vh,440px);padding:14px 16px 16px;overflow:hidden;cursor:default;
  display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 92% 8%,color-mix(in srgb,var(--lamp) 38%,transparent),transparent 42%),
    linear-gradient(180deg,var(--room-2),var(--room) 70%)}
.room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(216,163,107,.42);pointer-events:none}
.room.adv{cursor:pointer}
.round{position:relative;z-index:1;font-family:var(--f-talk);font-size:16px;color:var(--room-tag);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.scene{position:relative;z-index:1;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:stretch;margin-top:6px;flex:1 1 0;min-height:0}
#kid{width:150px;height:auto;display:block;align-self:end}
.talk{min-width:0;padding-bottom:6px;display:flex;flex-direction:column;min-height:0}
/* 대사가 한 글자씩 쌓이는 창. 문장을 다 쓰면 지난 대사가 위로 밀려 올라간다 */
.log{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  display:flex;flex-direction:column;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 28px);
  mask-image:linear-gradient(180deg,transparent 0,#000 28px)}
.log::-webkit-scrollbar{display:none}
.log>:first-child{margin-top:auto}
.ent{flex:none;font-family:var(--f-talk);font-size:23px;line-height:1.35;margin:0 0 .45em;text-wrap:pretty}
.ent:last-child{margin-bottom:0}
.ent:not(:last-child){opacity:.5}
.ent .who{display:block;font-family:var(--f-talk);font-size:15px;opacity:.75}
.ent.t{color:var(--mom)}
.ent.n{color:var(--narr);font-family:var(--f-body);font-size:18px}
.ent.typing .tx::after{content:'';display:inline-block;width:.45em;height:1em;vertical-align:-.14em;
  background:currentColor;opacity:.5;animation:caret .9s steps(1,end) infinite}
@keyframes caret{50%{opacity:0}}
.stamp{position:absolute;z-index:2;right:18px;top:40px;font-family:var(--f-display);font-size:42px;color:var(--heat);background:rgba(255,255,255,.72);
  border:5px solid var(--heat);border-radius:10px;padding:2px 14px;transform:rotate(-12deg) scale(2);opacity:0;pointer-events:none}
.stamp.on{animation:stamp 1.6s ease-out forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.2)}12%{opacity:1;transform:rotate(-12deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-12deg) scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.room.shake{animation:shake .35s}

/* Parent's side */
.desk{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:start}
.panel{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:14px;min-width:0}
.panel h2{margin:0 0 8px;font-size:15px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.says{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.says li{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:9px 12px;cursor:pointer;
  background:var(--paper);border:1.5px solid var(--line);border-radius:4px 14px 14px 14px}
.says li .n{font-family:var(--f-talk);color:var(--muted);width:1.1em;flex:none}
.says li .tx{font-family:var(--f-talk);font-size:17px;line-height:1.35;min-width:0}
.says li .pr{margin-left:auto;flex:none;font-size:11.5px;color:var(--muted);align-self:center;white-space:nowrap}
.says li:hover{border-color:color-mix(in srgb,var(--heat) 45%,var(--line))}
.says li.sel{border-color:var(--heat);background:color-mix(in srgb,var(--heat) 10%,var(--paper))}
.says li.sel .tx{text-decoration:underline wavy var(--heat);text-underline-offset:5px;text-decoration-thickness:1.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card b{font-size:13.5px;line-height:1.3}
.card span{font-size:11.5px;color:var(--muted)}
.card.sel{border-color:var(--heat);box-shadow:0 0 0 2px color-mix(in srgb,var(--heat) 30%,transparent)}
.doc{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:14px;min-height:60px}
.doc .ph{color:var(--muted);font-size:13px;margin:0}
.doc h3{margin:0 0 6px;font-size:14px}
.doc p{margin:0 0 6px}
.doc .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.doc .hl{background:color-mix(in srgb,var(--heat) 18%,transparent);border-radius:3px;padding:0 2px}
.doc table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.doc th{font-weight:700;color:var(--muted);font-size:12px}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13.5px}
.doc dt{color:var(--muted)} .doc dd{margin:0}
.chat{display:flex;flex-direction:column;gap:6px}
.chat div{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13.5px}
.chat .nm{font-weight:700;font-size:12px;color:var(--muted);grid-column:1/-1}
.chat .msg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;justify-self:start}
.chat .tm{font-size:11px;color:var(--muted);align-self:end;font-variant-numeric:tabular-nums}
.chat .sys{font-size:12.5px;color:var(--ok);font-weight:700}
.scroll{overflow-x:auto}

/* Mobile drawers (desktop keeps both panels on the desk) */
.picks{display:none}
.scrim{display:none}
.drawer-x{display:none}
.ev-pick{display:none}

/* Actions */
.actions{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;
  background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.actions button{border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:11px 8px;font-weight:700;line-height:1.2}
.actions button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.actions .primary{background:var(--heat);border-color:var(--heat);color:var(--heat-ink)}
.actions .primary small{color:inherit;opacity:.8}
.actions button:disabled{opacity:.4;cursor:not-allowed}

/* Screens */
.screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(3px);padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.screen[hidden],.next[hidden]{display:none!important}
.sheet{background:var(--surface);max-width:520px;width:100%;border-radius:10px;box-shadow:var(--shadow);padding:22px;
  border-top:6px solid var(--heat);position:relative}
.sheet small.k{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:2px 0 10px;line-height:1.15;text-wrap:balance;padding-right:90px}
.sheet p{margin:0 0 10px}
.sheet ul{margin:0 0 14px;padding-left:18px;display:grid;gap:4px}
.sheet .go{width:100%;background:var(--heat);color:var(--heat-ink);border:0;border-radius:8px;padding:13px;font-weight:700;font-size:16px}
.sheet .acts{display:flex;gap:8px}
.sheet .acts .go{flex:1}
.sheet .acts .list{flex:none;display:flex;align-items:center;justify-content:center;padding:13px 16px;border:1.5px solid var(--ink);border-radius:8px;color:var(--ink);background:transparent;font-weight:700;font-size:16px;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 16px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:6px;padding:6px 4px;font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.grade{position:absolute;right:16px;top:18px;width:86px;height:86px;border-radius:50%;border:4px double var(--heat);color:var(--heat);
  display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:16px;line-height:1.1;transform:rotate(14deg)}

@media (max-width:720px){
  .desk{grid-template-columns:1fr}
  .scene{grid-template-columns:96px 1fr;gap:10px}
  #kid{width:96px}
  .ent{font-size:20px}
  .brand h1,.clock b{font-size:22px}
  .room{min-height:230px}
  .gauges{grid-template-columns:1fr}
  /* 좁은 화면: 말·증거 패널을 좌우 서랍으로 빼고 버튼으로 연다 */
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .picks button{background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;
    padding:9px 11px;font-weight:700;line-height:1.25;text-align:left;min-width:0;display:flex;flex-direction:column;gap:1px}
  .picks button small{font-weight:400;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .picks button.on{border-color:var(--heat);box-shadow:0 0 0 2px color-mix(in srgb,var(--heat) 25%,transparent)}
  .picks button.on small{color:var(--heat)}
  .desk{display:contents}
  html,body{overflow-x:clip}
  .app{min-height:100svh}
  .room{flex:1 1 auto;display:flex;flex-direction:column}
  .scene{margin-top:auto}
  .panel{position:fixed;top:0;bottom:0;z-index:15;width:min(90vw,400px);border-radius:0;
    padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;
    visibility:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .28s ease,visibility 0s linear .28s}
  #pStatements{left:0;transform:translateX(-101%)}
  #pEvidence{right:0;transform:translateX(101%)}
  #pStatements.open,#pEvidence.open{transform:none;visibility:visible;transition:transform .28s ease,visibility 0s}
  .drawer-x{display:block;position:sticky;top:0;z-index:2;margin:0 0 8px auto;
    background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px}
  .ev-pick{display:block;position:sticky;bottom:0;z-index:2;width:100%;margin-top:10px;background:var(--heat);color:var(--heat-ink);
    border:0;border-radius:8px;padding:12px;font-weight:700;font-size:15px;box-shadow:0 -6px 12px var(--paper)}
  .ev-pick:disabled{opacity:.45;cursor:not-allowed}
  .scrim{display:block;position:fixed;inset:0;z-index:12;width:100%;border:0;padding:0;
    background:rgba(0,0,0,.42);-webkit-tap-highlight-color:transparent}
  .scrim[hidden]{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.stamp.on{opacity:1}}
</style>

<style>.title-back{color:inherit;text-decoration:none;margin-right:.3em}.title-back:hover{opacity:.7}</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand"><small>6학년 강재인 · 밤 9시 거실 면담</small><h1><a class="title-back" href="../index.html" aria-label="게임 목록으로">←</a>딱 <em>한 시간</em>만 했어요</h1></div>
    <div class="clock" id="clockBox"><b id="clock">21:40</b><small>22:00 잘 시간</small></div>
    <div class="gauges">
      <div class="g g-conf"><label>실토</label><div class="bar"><i id="gConf"></i></div><b id="nConf">0</b><small>100이 되면 재인이가 진짜 게임 시간을 털어놓는다</small></div>
      <div class="g g-upset" id="upsetBox"><label>삐짐</label><div class="bar"><i id="gUpset"></i></div><b id="nUpset">0</b><small>100이 되면 방문을 쾅 닫고 들어가 버린다</small></div>
    </div>
  </header>

  <section class="room" id="room" aria-live="polite">
    <div class="round"><span id="roundTag">핑계 1/4</span><span id="roundName">한 시간만 했어요</span></div>
    <div class="scene">
      <svg id="kid" viewBox="0 0 160 190" aria-label="강재인">
        <path d="M14 190c4-40 30-58 66-58s62 18 66 58z" fill="#3c7d8c"/>
        <path d="M50 136q30 22 60 0" stroke="#2c5f6b" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M68 146v22M92 146v22" stroke="#e9eef0" stroke-width="3" stroke-linecap="round"/>
        <circle cx="68" cy="170" r="3" fill="#e9eef0"/><circle cx="92" cy="170" r="3" fill="#e9eef0"/>
        <rect x="68" y="118" width="24" height="20" fill="#e8bd98"/>
        <path d="M30 86c-8-44 18-64 50-64s58 20 50 64c-2 20 2 36 10 50-16 4-30-4-36-16H56c-6 12-20 20-36 16 8-14 12-30 10-50z" fill="#231c1b"/>
        <circle cx="34" cy="82" r="10" fill="#e8bd98"/><circle cx="126" cy="82" r="10" fill="#e8bd98"/>
        <circle cx="80" cy="78" r="47" fill="#f2cfae"/>
        <path d="M32 78c-4-34 18-52 48-52 31 0 52 18 48 50-5-14-12-22-22-26-4 8-14 12-24 10 4-4 4-8 2-10-10 8-24 10-36 6 2 4 0 8-4 10-4 2-8 6-12 12z" fill="#231c1b"/>
        <rect x="100" y="38" width="18" height="7" rx="3.5" fill="#f07a9a" transform="rotate(-24 109 41)"/>
        <g data-f="normal sweat pout"><path d="M54 66l16 2M90 68l16-2" stroke="#231c1b" stroke-width="3.5" stroke-linecap="round"/></g>
        <g data-f="smug"><path d="M53 64l17 5M90 69l17-5" stroke="#231c1b" stroke-width="3.5" stroke-linecap="round"/></g>
        <g data-f="shock"><path d="M54 58l15-4M91 54l15 4" stroke="#231c1b" stroke-width="3.5" stroke-linecap="round"/></g>
        <g data-f="cry"><path d="M54 62l16 6M90 68l16-6" stroke="#231c1b" stroke-width="3.5" stroke-linecap="round"/></g>
        <g data-f="normal pout"><ellipse cx="62" cy="80" rx="5" ry="6.5" fill="#231c1b"/><ellipse cx="98" cy="80" rx="5" ry="6.5" fill="#231c1b"/><circle cx="64" cy="78" r="1.6" fill="#fff"/><circle cx="100" cy="78" r="1.6" fill="#fff"/></g>
        <g data-f="sweat"><ellipse cx="57" cy="80" rx="5" ry="6.5" fill="#231c1b"/><ellipse cx="93" cy="80" rx="5" ry="6.5" fill="#231c1b"/></g>
        <g data-f="smug"><path d="M54 81q8-5 16 0M90 81q8-5 16 0" stroke="#231c1b" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
        <g data-f="shock"><circle cx="62" cy="79" r="9" fill="#fff" stroke="#231c1b" stroke-width="2.5"/><circle cx="98" cy="79" r="9" fill="#fff" stroke="#231c1b" stroke-width="2.5"/><circle cx="62" cy="79" r="2.8" fill="#231c1b"/><circle cx="98" cy="79" r="2.8" fill="#231c1b"/></g>
        <g data-f="cry"><path d="M54 79q8 6 16 0M90 79q8 6 16 0" stroke="#231c1b" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M58 84q-3 12 0 22M102 84q3 12 0 22" stroke="#7cc4ef" stroke-width="5" fill="none" stroke-linecap="round"/></g>
        <g data-f="normal"><path d="M70 101q10 8 20 0" stroke="#7a3b2e" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
        <g data-f="smug"><path d="M68 100q14 6 24-4" stroke="#7a3b2e" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
